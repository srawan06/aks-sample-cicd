name: Cert-Manager - Install & Configure HTTPS

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'cert-manager/**'

permissions:
  id-token: write
  contents: read

jobs:
  install-cert-manager:
    name: Install cert-manager + ClusterIssuer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP || 'rg-aks-sample' }}" \
            --name "${{ vars.AKS_CLUSTER_NAME || 'aks-sample-cluster' }}" \
            --admin --overwrite-existing

      - name: Install cert-manager via Helm (includes CRDs)
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --set crds.enabled=true \
            --set resources.requests.cpu=50m \
            --set resources.requests.memory=64Mi \
            --set resources.limits.cpu=200m \
            --set resources.limits.memory=256Mi \
            --set webhook.resources.requests.cpu=25m \
            --set webhook.resources.requests.memory=32Mi \
            --set cainjector.resources.requests.cpu=25m \
            --set cainjector.resources.requests.memory=64Mi \
            --wait --timeout 5m

      - name: Apply ClusterIssuer
        run: |
          kubectl apply -f cert-manager/cluster-issuer.yaml

      - name: Show status
        run: |
          kubectl get pods -n cert-manager
          echo "---"
          kubectl get clusterissuer