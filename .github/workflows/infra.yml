name: Infra - Provision AKS

on:
  workflow_dispatch: {} # manual trigger - infra changes shouldn't auto-apply
  push:
    branches: [main]
    paths:
      - 'infra/**'

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

jobs:
  iac-scan:
    name: IaC security scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov against Bicep
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: bicep
          quiet: true
          soft_fail: true   # start permissive; flip to false once you've triaged findings

  deploy-infra:
    name: Deploy AKS via Bicep
    needs: iac-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # NOTE: this subscription rejects subscription-scope AKS deployments
      # (az deployment sub create / what-if) with a generic
      # "RequestDisallowedByAzure / best available regions" error, even
      # though the identical AKS spec succeeds at resource-group scope.
      # So we create the resource group as a plain CLI step, then deploy
      # the Bicep template into it at resource-group scope.
      #
      # This subscription's public IP quota (3) and AKS access were only
      # confirmed to work in uaenorth - we enforce that region here so a
      # future change to AZURE_LOCATION can't silently create resources
      # in an unverified region.
      - name: Create resource group (idempotent, region-locked)
        run: |
          REQUIRED_LOCATION="uaenorth"
          RG="${{ vars.AKS_RESOURCE_GROUP || 'rg-aks-sample' }}"
          CONFIGURED_LOCATION="${{ vars.AZURE_LOCATION || 'uaenorth' }}"

          if [ "$CONFIGURED_LOCATION" != "$REQUIRED_LOCATION" ]; then
            echo "::error::AZURE_LOCATION is set to '$CONFIGURED_LOCATION', but this project is locked to '$REQUIRED_LOCATION' (the only region confirmed to work on this subscription). Update the AZURE_LOCATION repo variable or this workflow's REQUIRED_LOCATION if that has genuinely changed."
            exit 1
          fi

          if az group show --name "$RG" &>/dev/null; then
            EXISTING_LOCATION=$(az group show --name "$RG" --query location -o tsv)
            if [ "$EXISTING_LOCATION" != "$REQUIRED_LOCATION" ]; then
              echo "::error::Resource group '$RG' already exists but its location is '$EXISTING_LOCATION', not '$REQUIRED_LOCATION'. Refusing to proceed - delete and recreate the group manually if you intend to change this."
              exit 1
            fi
            echo "Resource group '$RG' already exists in '$REQUIRED_LOCATION' - skipping creation."
          else
            echo "Creating resource group '$RG' in '$REQUIRED_LOCATION'..."
            az group create --name "$RG" --location "$REQUIRED_LOCATION"
          fi

      - name: Deploy Bicep (resource-group scope)
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AKS_RESOURCE_GROUP || 'rg-aks-sample' }}
          template: infra/main.bicep
          parameters: >
            location=uaenorth
            aksClusterName=${{ vars.AKS_CLUSTER_NAME || 'aks-sample-cluster' }}

      - name: Assign AKS Cluster Admin role to the CI service principal
        run: |
          RG="${{ vars.AKS_RESOURCE_GROUP || 'rg-aks-sample' }}"
          CLUSTER="${{ vars.AKS_CLUSTER_NAME || 'aks-sample-cluster' }}"
          AKS_ID=$(az aks show -g "$RG" -n "$CLUSTER" --query id -o tsv)
          az role assignment create \
            --assignee "${{ secrets.AZURE_CLIENT_ID }}" \
            --role "Azure Kubernetes Service Cluster Admin Role" \
            --scope "$AKS_ID" || echo "Role assignment may already exist, continuing"