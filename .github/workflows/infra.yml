name: Infra - Provision AKS

on:
  workflow_dispatch: {} # manual trigger - infra changes shouldn't auto-apply
  push:
    branches: [main]
    paths:
      - 'infra/**'

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

jobs:
  iac-scan:
    name: IaC security scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov against Bicep
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: bicep
          quiet: true
          soft_fail: true   # start permissive; flip to false once you've triaged findings

  deploy-infra:
    name: Deploy AKS via Bicep
    needs: iac-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # NOTE: this subscription rejects subscription-scope AKS deployments
      # (az deployment sub create / what-if) with a generic
      # "RequestDisallowedByAzure / best available regions" error, even
      # though the identical AKS spec succeeds at resource-group scope.
      # So we create the resource group as a plain CLI step, then deploy
      # the Bicep template into it at resource-group scope.
      #
      # KNOWN COSMETIC MISMATCH (tracked, not yet cleaned up): rg-aks-sample
      # itself carries a 'malaysiawest' location label from an early debugging
      # step, but the AKS cluster inside it genuinely runs in 'uaenorth'
      # (enforced below via the Bicep deploy parameters, independent of the
      # RG's label). A resource group's location is just metadata for its own
      # deployment history - it doesn't constrain where resources inside it
      # run. TODO: delete and recreate rg-aks-sample cleanly in uaenorth once
      # the full pipeline is validated end-to-end.
      - name: Create resource group (idempotent)
        run: |
          RG_REQUIRED_LOCATION="malaysiawest" # matches rg-aks-sample's existing label - see note above
          CLUSTER_LOCATION="uaenorth"          # where the AKS cluster itself actually runs
          RG="${{ vars.AKS_RESOURCE_GROUP || 'rg-aks-sample' }}"

          if az group show --name "$RG" &>/dev/null; then
            EXISTING_LOCATION=$(az group show --name "$RG" --query location -o tsv)
            if [ "$EXISTING_LOCATION" != "$RG_REQUIRED_LOCATION" ]; then
              echo "::error::Resource group '$RG' exists but its location is '$EXISTING_LOCATION', expected '$RG_REQUIRED_LOCATION'. If you cleaned this up manually, update RG_REQUIRED_LOCATION in this workflow to match."
              exit 1
            fi
            echo "Resource group '$RG' already exists (label: '$EXISTING_LOCATION'); AKS cluster will be deployed into it targeting '$CLUSTER_LOCATION' - skipping RG creation."
          else
            echo "Creating resource group '$RG' in '$CLUSTER_LOCATION'..."
            az group create --name "$RG" --location "$CLUSTER_LOCATION"
          fi

      - name: Deploy Bicep (resource-group scope)
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AKS_RESOURCE_GROUP || 'rg-aks-sample' }}
          template: infra/main.bicep
          parameters: >
            location=uaenorth
            aksClusterName=${{ vars.AKS_CLUSTER_NAME || 'aks-sample-cluster' }}

      - name: Assign AKS Cluster Admin role to the CI service principal
        run: |
          RG="${{ vars.AKS_RESOURCE_GROUP || 'rg-aks-sample' }}"
          CLUSTER="${{ vars.AKS_CLUSTER_NAME || 'aks-sample-cluster' }}"
          AKS_ID=$(az aks show -g "$RG" -n "$CLUSTER" --query id -o tsv)
          az role assignment create \
            --assignee "${{ secrets.AZURE_CLIENT_ID }}" \
            --role "Azure Kubernetes Service Cluster Admin Role" \
            --scope "$AKS_ID" || echo "Role assignment may already exist, continuing"